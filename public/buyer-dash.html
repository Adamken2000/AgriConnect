<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Buyer Orders</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="mb-8 pb-4 border-b border-slate-200">
            <span class="bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded text-xs font-bold">BUYER DASHBOARD</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Your Purchase Orders & Receipts</h1>
        </div>

        <!-- Orders Container -->
        <div class="space-y-6" id="buyer-orders-list"></div>
    </main>

   <!-- PRINTABLE RECEIPT MODAL -->
    <div id="printable-receipt" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-8 shadow-2xl relative border border-slate-200">
            <button onclick="closeReceipt()" class="no-print absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            
            <div id="receipt-content"></div>
            
            <div class="no-print mt-6 flex justify-end items-center space-x-3 pt-4 border-t border-slate-200">
                <button onclick="window.print()" class="bg-green-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-green-800 flex items-center space-x-1.5 shadow transition">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Print / Save as PDF</span>
                </button>
                <button onclick="closeReceipt()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300">Close</button>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
