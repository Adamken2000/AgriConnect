<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Account Access</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-md mx-auto px-4 py-12 w-full">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-8 space-y-6">
            <div class="flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">
                <button id="auth-tab-login" onclick="switchAuthMode('login')" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition">Login</button>
                <button id="auth-tab-register" onclick="switchAuthMode('register')" class="flex-1 py-2 rounded-lg text-slate-500 transition">Register</button>
            </div>
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-900" id="auth-title">Welcome!</h2>
                <p class="text-xs text-slate-500 mt-1" id="auth-subtitle">Sign in to your account</p>
            </div>
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="login-email" required placeholder="Email Address" class="w-full p-2.5 border rounded-xl text-xs">
                <input type="password" id="login-password" required placeholder="Password" class="w-full p-2.5 border rounded-xl text-xs">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-xl">Sign In</button>
                <div class="text-right">
                    <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-green-700 hover:underline font-semibold">Forgot Password?</button>
                </div>
            </form>
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="grid grid-cols-2 gap-2">
                    <label class="border p-2.5 rounded-xl flex items-center space-x-2"><input type="radio" name="auth-role" value="farmer" checked><span>Farmer</span></label>
                    <label class="border p-2.5 rounded-xl flex items-center space-x-2"><input type="radio" name="auth-role" value="buyer"><span>Buyer</span></label>
                </div>
                <input type="text" id="reg-name" required placeholder="Full Name" class="w-full p-2.5 border rounded-xl text-xs">
                <input type="email" id="reg-email" required placeholder="Email" class="w-full p-2.5 border rounded-xl text-xs">
                <input type="text" id="reg-location" required placeholder="County / Location" class="w-full p-2.5 border rounded-xl text-xs">
                <input type="password" id="reg-password" required placeholder="Password" class="w-full p-2.5 border rounded-xl text-xs">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-xl">Create Account</button>
            </form>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-900 text-lg">Reset Password</h3>
                <button onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500">Enter your registered email address and your new password.</p>
            
            <form onsubmit="handleForgotPasswordSubmit(event)" class="space-y-3">
                <input type="email" id="forgot-email" required placeholder="Registered Email Address" class="w-full p-2.5 border rounded-xl text-xs">
                <input type="password" id="forgot-new-password" required placeholder="New Password" class="w-full p-2.5 border rounded-xl text-xs">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-xl text-xs">Update Password</button>
            </form>
        </div>
    </div>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
