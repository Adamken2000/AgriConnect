<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Produce Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 pb-4 border-b border-slate-200 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">Fresh Produce Catalogue</h1>
                <p class="text-slate-500 text-sm">Browse, filter, and order high quality agricultural harvests</p>
            </div>
            <div class="flex flex-wrap gap-3 items-center">
                <div class="relative min-w-[240px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="catalogue-search-input" onkeyup="filterProduce()" placeholder="Search produce..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <select id="catalogue-category-filter" onchange="filterProduce()" class="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm">
                    <option value="ALL">All Categories</option>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Grains">Grains & Cereals</option>
                    <option value="Tubers">Tubers & Roots</option>
                    <option value="Dairy">Dairy & Poultry</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="catalogue-produce-grid"></div>
    </main>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
