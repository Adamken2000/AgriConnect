<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Contact Support</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm space-y-6">
            <div>
                <span class="text-xs font-bold text-green-700 uppercase tracking-widest bg-green-50 px-3 py-1 rounded-full border border-green-200">Get in Touch</span>
                <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Contact AgriConnect Support</h1>
                <p class="text-slate-500 text-xs mt-1">Questions regarding farmer account verification, bulk orders, or platform logistics?</p>
            </div>
            
            <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1" for="name">Your Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-green-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1" for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-green-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="e.g. Bulk tomato inquiry / Farmer verification" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1" for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required placeholder="Type your inquiry or message here..." class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-green-600"></textarea>
                </div>
                <button type="submit" class="bg-green-700 hover:bg-green-800 text-white font-bold px-6 py-2.5 rounded-xl text-xs shadow transition">Send Support Message</button>
            </form>

            <div class="border-t border-slate-100 pt-6 grid sm:grid-cols-3 gap-4 text-xs text-slate-600">
                <div>
                    <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-location-dot text-green-700 mr-1"></i> Headquarters</div>
                    <p>Nairobi AgriHub, Westlands, Kenya</p>
                </div>
                <div>
                    <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-phone text-green-700 mr-1"></i> Phone Support</div>
                    <p>+254 700 000000</p>
                </div>
                <div>
                    <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-envelope text-green-700 mr-1"></i> Email Support</div>
                    <p>support@agriconnect.co.ke</p>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
