<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Admin Control Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="mb-4 pb-4 border-b">
            <span class="bg-purple-100 text-purple-800 px-2.5 py-0.5 rounded text-xs font-bold">ADMINISTRATOR CONTROL PANEL</span>
            <h1 class="text-2xl font-extrabold mt-1">Platform Management & Approvals</h1>
        </div>

        <!-- Metrics Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl border shadow-sm">
                <div class="text-xs text-slate-500 font-semibold uppercase">Pending Listing Approvals</div>
                <div class="text-2xl font-bold text-amber-600 mt-1" id="admin-pending-produce-count">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border shadow-sm">
                <div class="text-xs text-slate-500 font-semibold uppercase">Total Platform Produce</div>
                <div class="text-2xl font-bold text-slate-800 mt-1" id="admin-total-produce-count">0</div>
            </div>
        </div>

        <!-- PRODUCE APPROVAL & CRUD SECTION -->
        <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
            <div class="p-4 bg-slate-800 text-white font-bold text-sm flex justify-between items-center">
                <span><i class="fa-solid fa-boxes-packing mr-2"></i>Global Produce Listing Verification & Management</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-100 font-bold text-slate-700 uppercase">
                        <tr>
                            <th class="p-3">Produce</th>
                            <th class="p-3">Farmer</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Price</th>
                            <th class="p-3">Approval Status</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-produce-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <!-- ORDER LIFECYCLE MANAGEMENT -->
        <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
            <div class="p-4 bg-slate-100 border-b font-bold text-sm text-slate-800">
                <i class="fa-solid fa-truck-fast mr-2"></i>Global Order Lifecycle Management
            </div>
            <div id="admin-orders-container" class="p-4 space-y-4 divide-y"></div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
