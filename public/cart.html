<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Cart & Checkout</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    <div id="site-header"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-6 flex items-center space-x-3">
            <i class="fa-solid fa-cart-shopping text-green-700"></i><span>Your Cart & Checkout</span>
        </h1>
        <div class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3 mb-4 flex justify-between">
                    <span>Selected Items</span><span id="cart-item-count-label" class="text-xs text-slate-500">0 items</span>
                </h2>
                <div id="cart-items-container" class="divide-y divide-slate-100"></div>
            </div>
            <div>
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4 sticky top-28">
                    <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Order Summary</h2>
                    <div class="space-y-2 text-sm text-slate-600">
                        <div class="flex justify-between"><span>Subtotal</span><span id="cart-subtotal" class="font-semibold text-slate-800">KES 0.00</span></div>
                        <div class="flex justify-between"><span>Logistics</span><span id="cart-shipping" class="font-semibold text-slate-800">KES 250.00</span></div>
                        <div class="border-t pt-3 flex justify-between text-base font-bold text-slate-900"><span>Total</span><span id="cart-grand-total" class="text-green-700">KES 250.00</span></div>
                    </div>
                    <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-3 pt-3 border-t">
                        <h3 class="text-xs font-bold text-slate-500 uppercase">Delivery Details</h3>
                        <input type="text" id="checkout-name" required placeholder="Recipient Name" class="w-full text-xs p-2.5 border rounded-lg">
                        <input type="text" id="checkout-address" required placeholder="Delivery Address (e.g., Westlands)" class="w-full text-xs p-2.5 border rounded-lg">
                        <select id="checkout-payment" class="w-full text-xs p-2.5 border rounded-lg">
                            <option value="mpesa">M-Pesa Express</option>
                            <option value="card">Credit Card</option>
                        </select>
                        <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-xl shadow">Confirm & Place Order</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
